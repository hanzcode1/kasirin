<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>README Reader</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root {
    --bg: #1a1b26;
    --bg-soft: #1f2030;
    --bg-card: #24263a;
    --border: #2e3048;
    --text: #c8cbe0;
    --text-soft: #8a8fb0;
    --text-strong: #e6e8f5;
    --accent: #a8b8ff;
    --accent-soft: #7c8bd6;
    --accent-pink: #e0b3d9;
    --accent-mint: #a8e0c8;
    --code-bg: #15161f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

    body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding-top: 69px; /* tinggi header, biar konten gak ketutup */
  }

  /* ===== HEADER ===== */
    header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 9999;
    background: rgba(26, 27, 38, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-sizing: border-box;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    color: var(--text-strong);
    font-size: 15px;
    letter-spacing: -0.01em;
  }

  .brand i { color: var(--accent); font-size: 18px; }

  .actions { display: flex; align-items: center; gap: 8px; }

  .icon-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-soft);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 14px;
  }

  .icon-btn:hover {
    background: var(--bg-soft);
    color: var(--accent);
    border-color: var(--accent-soft);
    transform: translateY(-1px);
  }

  .icon-btn:active { transform: translateY(0); }

  /* ===== CONTAINER ===== */
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 24px 96px;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== MARKDOWN STYLING ===== */
  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3,
  .markdown-body h4,
  .markdown-body h5,
  .markdown-body h6 {
    color: var(--text-strong);
    font-weight: 600;
    line-height: 1.3;
    margin-top: 2em;
    margin-bottom: 0.75em;
    letter-spacing: -0.02em;
    scroll-margin-top: 88px;
  }

  .markdown-body h1 {
    font-size: 2em;
    font-weight: 700;
    padding-bottom: 0.4em;
    border-bottom: 1px solid var(--border);
    margin-top: 0;
  }

  .markdown-body h2 {
    font-size: 1.5em;
    padding-bottom: 0.3em;
    border-bottom: 1px solid var(--border);
  }

  .markdown-body h3 { font-size: 1.2em; }
  .markdown-body h4 { font-size: 1.05em; }

  .markdown-body p { margin-bottom: 1.1em; color: var(--text); }

  .markdown-body a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }

  .markdown-body a:hover { border-bottom-color: var(--accent); }

  .markdown-body strong { color: var(--text-strong); font-weight: 600; }
  .markdown-body em { color: var(--accent-pink); font-style: italic; }

  .markdown-body ul,
  .markdown-body ol { margin: 0 0 1.1em 1.5em; }
  .markdown-body li { margin-bottom: 0.4em; }
  .markdown-body li::marker { color: var(--accent-soft); }

  .markdown-body blockquote {
    border-left: 3px solid var(--accent-soft);
    background: var(--bg-soft);
    padding: 12px 18px;
    margin: 1.2em 0;
    border-radius: 0 8px 8px 0;
    color: var(--text-soft);
    font-style: italic;
  }

  .markdown-body blockquote p:last-child { margin-bottom: 0; }

  .markdown-body code {
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    background: var(--code-bg);
    color: var(--accent-mint);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 0.88em;
    border: 1px solid var(--border);
  }

  .markdown-body pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    overflow-x: auto;
    margin: 1.2em 0;
    position: relative;
  }

  .markdown-body pre code {
    background: transparent;
    border: none;
    padding: 0;
    color: var(--text);
    font-size: 0.88em;
    line-height: 1.6;
  }

  .markdown-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.2em 0;
    font-size: 0.94em;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .markdown-body th,
  .markdown-body td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  .markdown-body th {
    background: var(--bg-soft);
    color: var(--text-strong);
    font-weight: 600;
  }

  .markdown-body tr:last-child td { border-bottom: none; }
  .markdown-body tr:hover td { background: var(--bg-soft); }

  .markdown-body hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2em 0;
  }

  .markdown-body img { max-width: 100%; border-radius: 10px; margin: 1em 0; }

  /* ===== LOADING & ERROR ===== */
  .state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 80px 24px;
    color: var(--text-soft);
    text-align: center;
  }

  .state i { font-size: 32px; color: var(--accent-soft); }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 5px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-soft); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 640px) {
    body { font-size: 15px; padding-top: 61px; }
    header { padding: 12px 16px; }
    .brand span { display: none; }
    .container { padding: 32px 16px 64px; }
    .markdown-body h1 { font-size: 1.6em; }
    .markdown-body h2 { font-size: 1.3em; }
    .markdown-body pre { padding: 14px 16px; font-size: 0.85em; }
    .markdown-body table { font-size: 0.85em; }
    .markdown-body th,
    .markdown-body td { padding: 8px 10px; }
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 { scroll-margin-top: 72px; }
  }

  @media (max-width: 400px) {
    .markdown-body h1 { font-size: 1.4em; }
    .markdown-body h2 { font-size: 1.15em; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <i class="fa-solid fa-book-open"></i>
    <span>README Reader</span>
  </div>
  <div class="actions">
    <button class="icon-btn" id="reloadBtn" title="Muat ulang">
      <i class="fa-solid fa-rotate-right"></i>
    </button>
    <button class="icon-btn" id="topBtn" title="Ke atas">
      <i class="fa-solid fa-arrow-up"></i>
    </button>
  </div>
</header>

<main class="container">
  <div id="loading" class="state">
    <div class="spinner"></div>
    <p>Memuat readme.md...</p>
  </div>

  <div id="error" class="state" style="display:none;">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <p id="errorMsg">Gagal memuat readme.md</p>
  </div>

  <article id="content" class="markdown-body" style="display:none;"></article>
</main>

<!-- Markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Sanitizer -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

<script>
(function () {
  'use strict';

  const loadingEl = document.getElementById('loading');
  const errorEl   = document.getElementById('error');
  const errorMsg  = document.getElementById('errorMsg');
  const contentEl = document.getElementById('content');
  const reloadBtn = document.getElementById('reloadBtn');
  const topBtn    = document.getElementById('topBtn');

  /* =========================================================
   * SLUGIFY
   * =======================================================*/
  function slugify(text) {
    return String(text)
      .toLowerCase()
      .trim()
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F2FF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/gu, '')
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');
  }

  /* =========================================================
   * MARKED CONFIG
   * pakai API paling aman: gfm + breaks, no custom renderer.heading
   * (karena signature-nya beda antar versi -> error)
   * =======================================================*/
  if (window.marked) {
    marked.setOptions({
      gfm: true,
      breaks: true,
      mangle: false,
      headerIds: false,   // dimatiin, kita inject id manual nanti
    });
  }

  /* =========================================================
   * INJECT ID KE SEMUA HEADING
   * dipanggil setelah render, biar gak peduli versi marked
   * =======================================================*/
  function injectHeadingIds(root) {
    const used = new Set();
    root.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(h => {
      let base = slugify(h.textContent || '');
      if (!base) base = 'section';
      let id = base;
      let i = 1;
      while (used.has(id)) {
        id = base + '-' + i++;
      }
      used.add(id);
      h.id = id;
    });
  }

  /* =========================================================
   * NORMALIZE LINK INTERNAL
   * biar "#-fitur-utama" -> "#fitur-utama"
   * =======================================================*/
  function normalizeInternalLinks(root) {
    root.querySelectorAll('a[href^="#"]').forEach(a => {
      const raw = a.getAttribute('href').slice(1);
      if (!raw) return;
      const cleaned = slugify(decodeURIComponent(raw));
      if (cleaned) a.setAttribute('href', '#' + cleaned);
      else a.setAttribute('href', '#' + raw);
    });
  }

  /* =========================================================
   * EXTERNAL LINK
   * =======================================================*/
  function markExternalLinks(root) {
    root.querySelectorAll('a[href^="http"]').forEach(a => {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    });
  }

  /* =========================================================
   * SMOOTH SCROLL
   * =======================================================*/
  function scrollToTarget(target) {
    if (!target) return;
    const headerHeight = document.querySelector('header').offsetHeight;
    const y = target.getBoundingClientRect().top + window.pageYOffset - headerHeight - 16;
    window.scrollTo({ top: y, behavior: 'smooth' });
  }

  function bindAnchorScroll(root) {
    root.querySelectorAll('a[href^="#"]').forEach(link => {
      link.addEventListener('click', (e) => {
        const id = decodeURIComponent(link.getAttribute('href').slice(1));
        if (!id) return;
        const target = document.getElementById(id);
        if (!target) return;
        e.preventDefault();
        scrollToTarget(target);
        history.replaceState(null, '', '#' + id);
      });
    });
  }

  function scrollToHashOnLoad() {
    const raw = decodeURIComponent(window.location.hash.slice(1));
    if (!raw) return;
    const target = document.getElementById(raw);
    if (!target) return;
    setTimeout(() => scrollToTarget(target), 100);
  }

  window.addEventListener('hashchange', () => {
    const raw = decodeURIComponent(window.location.hash.slice(1));
    if (!raw) return;
    const target = document.getElementById(raw);
    if (target) scrollToTarget(target);
  });

  /* =========================================================
   * RENDER MARKDOWN (dengan fallback kalau marked gagal)
   * =======================================================*/
  function renderMarkdown(text) {
    if (window.marked && typeof marked.parse === 'function') {
      return marked.parse(text);
    }
    if (window.marked && typeof marked === 'function') {
      return marked(text);
    }
    // fallback super minimal
    return '<pre>' + text.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c])) + '</pre>';
  }

  /* =========================================================
   * LOAD README
   * =======================================================*/
  async function loadReadme() {
    loadingEl.style.display = 'flex';
    errorEl.style.display = 'none';
    contentEl.style.display = 'none';

    try {
      const res = await fetch('readme.md', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const text = await res.text();
      const html = renderMarkdown(text);

      const clean = window.DOMPurify
        ? DOMPurify.sanitize(html, { ADD_ATTR: ['target', 'id'] })
        : html;

      contentEl.innerHTML = clean;

      injectHeadingIds(contentEl);
      normalizeInternalLinks(contentEl);
      markExternalLinks(contentEl);
      bindAnchorScroll(contentEl);

      contentEl.style.display = 'block';
      loadingEl.style.display = 'none';

      scrollToHashOnLoad();
    } catch (err) {
      loadingEl.style.display = 'none';
      errorEl.style.display = 'flex';
      errorMsg.textContent = 'Gagal memuat readme.md — ' + err.message;
    }
  }

  reloadBtn.addEventListener('click', loadReadme);
  topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  loadReadme();
})();
</script>

</body>
</html>
